  relationship: builds-on
  note: 'The NP-completeness foundation, required by Lake at the commit 3e603e795b44fedcf7d6dd65b7d1e30547ead925
    (Apache-2.0). Its machine model (the block Symbol through NPComplete of its Challenge, whole, including
    PolyTime), its CNF formulas and their unary code (Complexity.SAT: Word through encode, clauseBound,
    variableBound) are used unchanged and copied verbatim into the Challenge; its structured stack language
    and compiler (StackTableauProgram.Command, StackCompile.polyTime_of_stack) give the polynomial-time
    single-tape machine of the instance map.'
- id: Max3SAT-MaxSNP-APX-Lean4, commit 10079b2a14bd0df47d2a24364133f6008b9c207f
  relationship: builds-on
  note: 'Required by Lake (package pcp, Apache-2.0) in a derived packaging that shares the workspace with
    the NP-completeness foundation: its 75 Complexity/ files that are byte-identical to NPCompleteness-Lean4
    at 3e603e7 are taken from that package, and its 12 other Complexity/ modules are moved under the module
    prefix ComplexityExt, because Lake resolves imports by module name (DERIVED.md, derive_pcp.sh and
    verify_derived_pcp.sh in the package; declarations, namespaces and every other line are unchanged).
    Its optimization problems, L-reductions, MaxSNP, APX, PTAS and 3-OCCURRENCE MAX-3-SAT (Complexity.PEqNP
    through Complexity.APXHard) are copied verbatim into the Challenge; its theorems max3SAT3_maxSNPHard,
    lReducible_max3SAT_max3SAT3, witnessGap, apxHard_of_lReducible_max3SAT, maxSNPHard_not_hasPTAS and
    maxSNPHard_no_ptas, and its PT framework for polynomial time, are used. Commit 10079b2 restricts MaxSNP0
    to structures of fixed signatures and MaxSNP to NPO problems (earlier commits admitted unbounded solution
    relations). This project does not modify it.'
