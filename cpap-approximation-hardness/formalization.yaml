version: v0.4
project:
  name: 'Cycle-path assignment: approximation hardness and reduction algorithms in Lean 4'
  description: 'Formalizes Section 6 and Appendix D, together with the Section 5 reduction algorithms,
    of "Cycle-Path Assignment for Local Differential Privacy: Complexity and Approximation". Theorem 11
    proves MaxSNP-hardness and APX-hardness for every fixed k >= 5; Corollary 12 proves that a PTAS would
    imply P = NP. The package proves the optimum identity C* + S* = 2m, the gadget L-reduction with alpha
    = 5/3 and beta = 1, Lemma 10''s polarity transformation with alpha = beta = 1, and composition on
    the paper''s source class. A polynomial-time L-reduction from the imported broader 3-OCCURRENCE MAX-3-SAT
    language has alpha = 9 and beta = 1 after unit-clause normalization. The formalized PCP and MaxSNP/APX
    source theorems are supplied by the bundled pcp dependency. Actual RAM programs provide the Section
    5 gadget construction, compatible planar orientation, formula-only planar embedding, polarity transformation
    and decoding, with bounded time and accessed addresses. The formula-only embedding takes RAM.ramInput
    f under bounded occurrence and incidence planarity and uses at most 100000 * (input.length + variableBound
    f + 1) steps and addresses. Polynomial-time maps are also proved in the foundation''s single-tape
    machine model. Only propext, Classical.choice and Quot.sound are permitted.'
  license: Apache-2.0
  authors:
  - ANONYMIZED
  responsible_maintainers:
  - ANONYMIZED
classification:
  arxiv:
  - cs.CC
  - cs.DS
  msc2020:
  - 68Q17
  - 68W25
  - 05C38
  - 68V20
