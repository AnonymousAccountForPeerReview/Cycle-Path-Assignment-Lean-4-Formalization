  relationship: background
  note: The MaxSNP-completeness of 3-OCCURRENCE MAX-3-SAT (Theorem 13.10) as the manuscript cites it;
    formalized in Max3SAT-MaxSNP-APX-Lean4.
- title: Proof verification and the hardness of approximation problems
  type: paper
  id: doi:10.1145/278298.278306
  location: Journal of the ACM 45(3), 501-555, 1998
  relationship: background
  note: The PCP theorem, from which Corollary 12 follows (with ANONYMIZED and ANONYMIZED, below); formalized
    in Max3SAT-MaxSNP-APX-Lean4 (by OpenAI's gap amplification), whose Complexity.maxSNPHard_not_hasPTAS
    and Complexity.maxSNPHard_no_ptas give STACS2027.cpap_no_ptas and STACS2027.cpap_not_approximable.
- title: 'Probabilistic checking of proofs: a new characterization of NP'
  type: paper
  id: doi:10.1145/273865.273901
  location: Journal of the ACM 45(1), 70-122, 1998
  relationship: background
  note: With the previous entry, the PCP theorem behind Corollary 12; formalized in Max3SAT-MaxSNP-APX-Lean4.
- title: Time bounded random access machines
  type: paper
  id: doi:10.1016/S0022-0000(73)80029-7
  location: Journal of Computer and System Sciences 7(4), 354-375, 1973
  relationship: background
  note: 'The unit-cost RAM (constants, addition, subtraction, indirect load and store, output) in which
