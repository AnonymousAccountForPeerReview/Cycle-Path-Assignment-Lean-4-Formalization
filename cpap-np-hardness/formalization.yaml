version: v0.4
project:
  name: 'Cycle-path assignment: shared model and NP-hardness in Lean 4'
  description: 'Formalizes the shared CPAP model of Section 2.2 and the NP-hardness results of Section
    5 and Appendix C of "Cycle-Path Assignment for Local Differential Privacy: Complexity and Approximation".
    Definition 1 chooses one path of k - 2 edges per simple k-cycle and measures cost by the sum of binom(l(e),
    2). For every fixed k >= 5, cpap_np_hard and planarCPAP_np_hard prove NP-hardness on general and planar
    graphs using polynomial-time reductions in the pinned foundation''s single-tape machine model. planarLeOneLeTwoSAT_np_complete
    proves the planar bounded-occurrence SAT source NP-complete. The explicit Appendix C gadgets, Theorem
    8''s correctness for every endpoint order, planarity for a compatible order, linear size and a bounded-work
    linear word-machine construction are proved in the library. The sibling cpap-approximation-hardness
    supplies the Section 5 linear RAM implementation and formula-only planar embedding. Only propext,
    Classical.choice and Quot.sound are permitted.'
  license: Apache-2.0
  authors:
  - ANONYMIZED
  responsible_maintainers:
  - ANONYMIZED
classification:
