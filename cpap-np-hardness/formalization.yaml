fidelity:
  divergences: '- Machine model, NP, reductions, encoding and planarity: as in the NP-completeness foundation
    NPCompleteness-Lean4 (see its fidelity notes). In particular, planarity is the genus-zero hypermap
    (rotation-system) definition, and words coding no instance are in none of the languages.

    - Planar (≤1,≤2)-SAT: the foundation''s (≤1,≤2) restriction with a planar incidence graph. Like the
    foundation''s restriction it does not require distinct variables in a clause, unlike Planar-(≤1,≤2)-SAT
    as the manuscript defines it; the library proves NP-hardness of Planar-(≤1,≤2)-SAT exactly as defined
    as well (Paper.planarLeOneLeTwoCNF_np_hard).

    - CPAP instances are lists of records under the foundation''s CNF code: a clause of two positive literals
    is an edge, an empty clause a unit of budget. The graph is the list of these edges; each simple k-cycle
    is counted once, by its edge set.

    - The cost of an assignment is the number of edges shared by pairs of chosen paths, counted with multiplicity;
    it equals the manuscript''s sum over edges of binom(l(e), 2) (cpap_objective).

    - CPAP is shown NP-hard, not NP-complete; the manuscript does not claim membership.

    - Theorem 8''s O(n) time is proved as a bound on the number of edges and as a transition bound for
    a word machine that reads the endpoint identifications as data, not as a single-tape bound; the compared
    hardness theorems use polynomial-time single-tape reductions.

    - Definition 22 identifies endpoints in an arbitrary order. Correctness is proved for every order
    and planarity for a compatible order; a fixed order can create a K_{3,3} subdivision (Paper.fixed_endpoints_K33).'
alignment:
  namespace: STACS2027
  statements:
  - source: 'Theorem 6: for every fixed k >= 5, CPAP(G, k) is NP-hard on planar graphs'
    lean: 'STACS2027.planarCPAP_np_hard : 5 ≤ k → NPHard (PlanarCPAP k)'
    module: Solution
    status: proved
    note: Gadget gluing along the planar incidence graph of the planar source, with the endpoint rule
      computed by the reduction; the target language requires planarity of the written graph itself.
  - source: 'Theorem 6, last sentence: CPAP(G, k) is NP-hard on general graphs'
    lean: 'STACS2027.cpap_np_hard : 5 ≤ k → NPHard (CPAP k)'
    module: Solution
    status: proved
    note: Gadget gluing from the foundation's (≤1,≤2)-SAT.
  - source: 'ANONYMIZED et al. (2008), cited for Theorem 6: Planar-(≤1,≤2)-SAT is NP-hard'
    lean: 'STACS2027.planarLeOneLeTwoSAT_np_complete : NPComplete PlanarLeOneLeTwoSAT'
    module: Solution
    status: proved
    note: In NP by the foundation's planar 3-SAT verifier with occurrence checks; NP-hard by occurrence
      rings on the foundation's planar grid formula.
  - source: Theorem 8 (correctness and planarity of the construction)
    lean: STACS2027.Paper.gadget_reduction_planar, Paper.gadget_reduction_any_endpoints, Paper.gadget_reduction_full_domain
    module: NPHardness.Paper
    status: proved
    note: 'The library proves correctness for every endpoint order and planarity for compatible choices.
      cpap-approximation-hardness proves orientation_linear_ram and Embed.planarEmbedding_linear_ram:
      a fixed formula-only RAM program under BoundedOccurrence and incidence planarity computes a planar
      rotation with time and accessed addresses linear in input.length + variableBound f + 1. The planar
      NP-hardness reduction here also computes endpoint data on its own source family.'
