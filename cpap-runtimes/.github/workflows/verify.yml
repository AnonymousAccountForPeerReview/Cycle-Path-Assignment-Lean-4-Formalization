name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"
          use-mathlib-cache: "false"
      # Mathlib comes from its official cache.
      - run: lake exe cache get
      # The library, Solution, Challenge and the axiom guards. The sibling packages
      # (cpap-outerplanar, cpap-tractability, cpap-bounded-cost, cpap-approximation) are required by path
      # and must be checked out next to this package.
      - run: lake build
      - run: python3 scripts/generate_challenge.py
      - run: lake build Challenge
      - run: python3 scripts/check_repository.py
      - run: python3 scripts/generate_challenge.py --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Install Comparator sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Comparator's sandbox shows it only the project directory: the path dependencies must
      # lie inside it for this run (docs/VERIFICATION.md).
      - run: PATH="$(lean --print-prefix)/bin:$PATH" lake comparator --config comparator.json --paranoid
