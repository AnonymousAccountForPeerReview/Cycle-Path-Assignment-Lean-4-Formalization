status:
  scope: 'The 31 comparison endpoints and supporting programs are checked under the permitted axiom boundary.
    Linear 2-SAT, k >= 4 zero-cost execution, four-cycle and general fixed-length enumeration, greedy
    execution, and the exact convex-relaxation solver require no excluded solver. Flow-dependent programs
    prove implications: F endpoints assume a correct supplied flow program and explicit T bound; F+ endpoints
    also assume AlmostLinear T, including the concrete Almost 2-SAT compiler, fixed-parameter bounded-cost
    programs and increasing-budget optimum search. Generic modular Almost 2-SAT interfaces remain available
    and are instantiated by that compiler. Input cycles are charged separately except where a complete
    enumeration/assignment program is exhibited. Bounds count RAM steps and maximum read/write addresses;
    label-dependent memory is retained where used. The almost-linear minimum-cost-flow implementation
    and resource analysis are the sole excluded algorithmic contract. Flow.MinCostFlowSolver F T is an
    explicit correctness and resource premise; Flow.AlmostLinear T adds the almost-linear bound. These
    are theorem hypotheses, not additional Lean axioms.'
