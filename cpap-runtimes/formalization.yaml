fidelity:
  divergences: The RAM model and verification infrastructure come from cpap-outerplanar/Outerplanar. Natural-number
    addition/subtraction, access, and control have unit cost; cells are unbounded and the proved space
    quantity bounds read/write addresses, not bit complexity. Most assignment programs take the canonical
    cycle list as input; the complete Corollary 3 program includes enumeration. Label dictionaries add
    a labelBound term; sorted construction proves label-independent bounds but does not erase the full
    four-cycle lister's dictionary. Generic modular endpoints can take Almost2SatSolver and FPTBound premises;
    the final compiler instantiates these conditionally on the sole F+ flow contract. The k >= 4 decision
    program uses the encoding without a second 2-SAT call; optimum search constructs a compact occurrence
    core once. Four-cycle listing, 2-SAT and convex optimization use separately verified procedures meeting
    the required guarantees, rather than assuming the cited implementations.
