status:
  scope: 'The 21 comparison endpoints and supporting lemmas are proved: encoding equivalences and sizes,
    exact prefix counts, cycle-core preservation, deletion and path recovery, Algorithm 3 correctness
    for k >= 4, and functional optimum search with a correct decision procedure. cpap-runtimes supplies
    unconditional linear 2-SAT and k >= 4 zero-cost execution, and flow-conditional FPT and optimum-search
    programs for all k >= 3. The almost-linear minimum-cost-flow implementation and resource analysis
    are the sole excluded algorithmic contract. Flow.MinCostFlowSolver F T is an explicit correctness
    and resource premise; Flow.AlmostLinear T adds the almost-linear bound. These are theorem hypotheses,
    not additional Lean axioms.'
