fidelity:
  divergences: The common CPAP model uses one representative per cycle edge set and one omitted vertex
    per path. CNF formulas are lists, so repeated clauses are distinct occurrences. Variables use natural-number
    indices; candidate overlaps are ordered triples (i, i', e) with i < i'. Recovery chooses the first
    vertex incident to every marked edge. Local algorithm correctness quantifies over solver outputs;
    local optimum search quantifies over a correct Boolean decision procedure. The executed companion
    compiler and timed optimum search have F+ premises. The triangle branch is supplied by the flow packages,
    while the 2-CNF encoding here includes k = 4.
alignment:
  namespace: STACS2027
  statements:
  - source: 'Proof of Corollary 5: an edge in p ≥ 2 cycles uses p − 1 auxiliary variables and 3p − 4 clauses'
    lean: STACS2027.prefixAuxiliaryVariables_count, STACS2027.prefixClauses_length, STACS2027.prefixEncodingClauseCount
    module: Solution
    status: proved
    note: The auxiliary variables are listed once; the clause total counts occurrences, including repetitions.
      The retained proposition PrefixEncodingClauseCount is proved.
  - source: 'Theorem 4 and Appendix B: Almost 2-SAT accepts Γ'' exactly when an assignment of cost at
      most Ψ exists'
    lean: 'STACS2027.almostSatisfiable_iff_hasAssignment : 4 ≤ k → (AlmostSatisfiable (almostFormula g
      k Ψ) Ψ ↔ HasAssignment g k Ψ)'
    module: Solution
    status: proved
    note: Both directions, through the correctness of Γ_𝓘 (STACS2027.permittedFormula_satisfiable_iff)
      and the survival of every path constraint under at most Ψ deletions.
  - source: 'Appendix B, running time: kt variables, k(k-3)t/2 path constraints, |𝒰| ≤ kt²/2, O((Ψ+1)k²t
      + kt²) clause occurrences'
    lean: STACS2027.almostFormula_size
    module: Solution
    status: proved
    note: 'Exact counts: 2|Γ₁| = k(k-3)t, 2|𝒰| ≤ kt(t-1), |Γ''| = (Ψ+1)|Γ₁| + |𝒰|; every clause has two
      literals on variables below kt.'
  - source: 'Corollary 5: the prefix encoding is satisfiable exactly when a zero-cost assignment exists'
    lean: 'STACS2027.zeroCostFormula_satisfiable_iff : 4 ≤ k → (Satisfiable (zeroCostFormula g k) ↔ HasAssignment
      g k 0)'
    module: Solution
    status: proved
    note: Both directions, through the prefix indicators 'some earlier b is false'.
  - source: 'Corollary 5: O(kt) variables and O(k²t) clauses'
    lean: STACS2027.zeroCostFormula_size
    module: Solution
    status: proved
    note: Every variable index is below 2kt, with at most |Γ₁| + 3kt two-literal clause occurrences and
      2|Γ₁| = k(k-3)t. The empty-cycle instance is included.
  - source: 'Appendix B and Algorithm 3: restricting G to its k-cycle core (the vertices and edges on
      k-cycles) changes neither the feasible assignments nor their costs'
    lean: STACS2027.mem_kCycleCore_iff, STACS2027.mem_vertices_kCycleCore_iff, STACS2027.isCycle_kCycleCore_iff,
      STACS2027.cycles_kCycleCore, STACS2027.hasAssignment_kCycleCore_iff
    module: Solution
    status: proved
    note: The enumerated k-cycles of the core are those of G, in the same order, so every formula built
      from them is unchanged (STACS2027.encodings_kCycleCore).
  - source: 'Algorithm 3: 𝓘 ← {u ∈ 𝒰 : λ_u deleted by 𝒟}; σ ← Solve-2-SAT(Γ_𝓘)'
    lean: STACS2027.deletedOverlaps_spec
    module: Solution
    status: proved
    note: '|𝓘| ≤ Ψ, and every truth assignment satisfying the clauses kept by 𝒟 satisfies Γ_𝓘, so the
      2-SAT call does not fail.'
  - source: 'Algorithm 3, last loop: W_C, ρ(C) with W_C ⊆ E(C, ρ(C)), τ(C) = E(C) \ E(C, ρ(C)); Appendix
      B: c(τ) ≤ |𝓘|'
    lean: STACS2027.recoveredPath_spec, STACS2027.recoverAssignment_correct
    module: Solution
    status: proved
    note: The recovery is a computable function of σ; for every σ satisfying Γ_𝓘 (k ≥ 4) it is a valid
      assignment of cost at most |𝓘|.
  - source: 'Corollary 5: from a satisfying truth assignment we recover paths as in the proof of Theorem
      4'
    lean: STACS2027.recoverAssignment_zeroCost
    module: Solution
    status: proved
  - source: 'Algorithm 3 and Appendix B: for Ψ = 0, ordinary 2-SAT on Γ_∅ suffices'
    lean: STACS2027.permittedFormula_nil_satisfiable_iff
    module: Solution
    status: proved
  - source: 'Algorithm 3 (k ≥ 4): returns an assignment τ with c(τ) ≤ Ψ, or ⊥ if none exists'
    lean: STACS2027.algorithm3_correct
    module: Solution
    status: proved
    note: Run on the k-cycle core, with the outputs of the cited Almost 2-SAT and 2-SAT solvers quantified
      over.
  - source: 'Appendix B: the same algorithm computes OPT by testing Ψ = 0, 1, 2, … until an assignment
      is returned'
    lean: STACS2027.almostSatisfiable_mono, STACS2027.exists_almostSatisfiable, STACS2027.isOptimalCost_iff_least_accepted,
      STACS2027.searchOptimum_correct
    module: Solution
    status: proved
    note: The test is monotone and eventually succeeds; the first accepted Ψ is OPT; searchOptimum, run
      with any correct decision procedure for the test, returns OPT.
  - source: 'Theorem 4 and Algorithm 3: companion executed all-k decision and optimum search'
    lean: STACS2027.Runtimes.BoundedCost.boundedCost_ram_all_from_citedFlow, STACS2027.Runtimes.BoundedCost.optimalCost_ram_fpt_from_citedFlow
    module: Runtimes.BoundedCost.ActualFPT, Runtimes.BoundedCost.OptMain
    status: proved
    note: 'The companion all-k decision and optimum-search conclusions have dependency F+: explicit flow
      correctness and almost-linear resource premises. The Almost 2-SAT compiler instantiates the required
      solver interface; there is no additional external Almost 2-SAT oracle.'
