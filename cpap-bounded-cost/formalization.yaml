version: v0.4
project:
  name: Bounded-cost and zero-cost CPAP encodings in Lean 4
  description: 'Section 4 and Appendix B: Theorem 4''s Almost 2-SAT encoding, Corollary 5''s zero-cost
    prefix encoding, exact encoding sizes, and Algorithm 3''s cycle-core preservation, deletion recovery,
    and functional optimum search, for k >= 4. Local correctness theorems quantify over correct solver
    outputs. cpap-runtimes supplies executed 2-SAT, an Almost 2-SAT compiler, the all-k >= 3 decision
    program and optimum search. The compiler, fixed-parameter, and optimum-search runtime endpoints explicitly
    require both flow correctness and the almost-linear bound. The almost-linear minimum-cost-flow implementation
    and resource analysis are the sole excluded algorithmic contract. Flow.MinCostFlowSolver F T is an
    explicit correctness and resource premise; Flow.AlmostLinear T adds the almost-linear bound. These
    are theorem hypotheses, not additional Lean axioms.'
  license: Apache-2.0
  authors:
  - ANONYMIZED
  responsible_maintainers:
  - ANONYMIZED
classification:
  arxiv:
  - cs.DS
  - cs.CC
  msc2020:
  - 68Q25
  - 68Q27
  - 05C38
  - 68V20
sources:
- title: 'Cycle-Path Assignment for Local Differential Privacy: Complexity and Approximation'
  type: other
  location: 'the accompanying paper: Section 4 (Theorem 4, Corollary 5) and Appendix B (the k-cycle core,
    Algorithm 3, proof of Theorem 4, computing OPT, proof of Corollary 5)'
  relationship: formalizes
  note: The numbered paper results and supporting claims are mapped to Lean in README.md and docs/paper-map.md.
    Source identity and result labels are recorded in docs/manuscript-provenance.json.
- title: Almost 2-SAT is fixed-parameter tractable
  type: paper
  id: doi:10.1016/j.jcss.2009.04.002
  location: Journal of Computer and System Sciences 75(8), 435-450, 2009
  relationship: background
  note: The manuscript citation remains. This package proves the encoding and recovery; cpap-runtimes
    supplies the executed iterative-compression compiler. Its actualCompilerRAM_fpt endpoint has explicit
    MinCostFlowSolver and AlmostLinear premises (F+), rather than an extra external Almost 2-SAT premise.
- title: A linear-time algorithm for testing the truth of certain quantified boolean formulas
  type: paper
  id: doi:10.1016/0020-0190(79)90002-4
  location: Information Processing Letters 8(3), 121-123, 1979
  relationship: background
  note: The linear-time 2-SAT citation used for Ψ = 0 and Corollary 5 remains. The companion cpap-runtimes
    theorem TwoSat.exists_linear_twoSat supplies an executed linear-time solver using a path-based strongly
    connected component procedure.
