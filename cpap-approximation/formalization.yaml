status:
  scope: 'Proved: the seven compared theorems, on the enumerated k-cycles; graph-level cost bounds require
    duplicate-free edge lists. Algorithm 1 and
    every run of it (any tie-breaking) is a cycle-path assignment; Lemma 13 and Theorem 14 hold for every
    run against every assignment, in the polynomial forms (S − S'')² ≤ 4 S S'' and (2 ALG + Q − (2 OPT
    + Q))² ≤ 4 (2 ALG + Q)(2 OPT + Q), and in integers 2 ALG ≤ 12 OPT + 5 Q. For an optimal fractional
    solution with common denominator D of the relaxation: independent randomized rounding has k D^t E[c(τ)]
    ≤ D^t (k OPT + (k − 2) t) (Theorem 17), and Algorithm 2 and every run of it is an assignment with
    k c(τ) ≤ k OPT + (k − 2) t (Theorem 18). All restated in the manuscript''s terms in Approximation/Paper.lean.
    The companion cpap-runtimes package supplies Lemma 16''s exact polynomial-time relaxation solver
    (QPRam.relaxSolver_ram_optimal), Lemma 15''s executed greedy program (Greedy.greedy_ram), and the
    actual fixed-length cycle enumerator generalCycleEnumerationRam. The paper states Algorithm 2''s correctness
    and cost guarantee without a separate running-time theorem. Sections 3, 4, 5, 6 and 8 are formalized
    in companion projects.'
