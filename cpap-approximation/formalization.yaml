version: v0.4
project:
  name: 'Approximation algorithms for cycle-path assignment: Lemma 13 and Theorems 14, 17, 18, in Lean
    4'
  description: 'A Lean 4 formalization of Section 7 of the accompanying paper "Cycle-Path Assignment
    for Local Differential Privacy: Complexity and Approximation". The cycle-path assignment problem CPAP(G,
    k) asks for one path of k - 2 edges in every simple k-cycle of a graph G minimizing the sum over edges
    of binom(l(e), 2), l(e) being the number of chosen paths through e. Section 7 gives two approximation
    algorithms on the t enumerated k-cycles: the greedy Algorithm 1, which assigns each cycle a path of
    minimum current load-sum, with ALG ≤ (3 + 2√2) OPT + (1 + √2)(k − 2) t (Lemma 13, Theorem 14); and
    a convex relaxation with independent randomized rounding, E[c(τ)] ≤ OPT + (k − 2) t / k (Theorem 17),
    derandomized by conditional expectation as Algorithm 2 with the same bound (Theorem 18). The compared
    theorems prove the guarantees for every run of each algorithm (any tie-breaking) against every assignment,
    the irrational constants replaced by the equivalent polynomial inequalities (S − S'')² ≤ 4 S S'' and
    (A − B)² ≤ 4 A B with A = 2 ALG + Q, B = 2 OPT + Q, Q = (k − 2) t, plus the integer form 2 ALG ≤ 12
    OPT + 5 Q), the fractional solution given with a common denominator D and its optimality quantified
    over all fractional solutions of the instance, and the expectation of the rounding as the finite sum
    over the product distribution. The cycles, paths and cost are those of the formalization of Section
    5 of the same manuscript, on which this project depends and whose definitions it copies verbatim.
    The graph-level cost bounds require duplicate-free edge lists. Lemma 16 (polynomial-time solvability
    of the relaxation) and Lemma 15 (Algorithm 1 runs in O(kt + Υ_k) time) are proved in the companion
    cpap-runtimes package by an exact rational solver and an executed greedy program. The proof uses
    only the axioms propext, Classical.choice and Quot.sound.'
  license: Apache-2.0
  authors:
  - ANONYMIZED
  responsible_maintainers:
  - ANONYMIZED
