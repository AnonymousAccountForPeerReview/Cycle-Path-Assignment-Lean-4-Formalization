fidelity:
  divergences: '- The cycle-path assignment problem is the Section 5 formalization''s: simple k-cycles
    are enumerated and identified by their edge sets, an assignment omits one vertex of each, the cost
    is the number of edges shared by pairs of chosen paths (equal to the manuscript''s sum over edges
    of binom(l(e), 2)).

    - Lemma 13 and Theorem 14 are stated without square roots, as (S − S'')² ≤ 4 S S'' and (A − B)² ≤
    4 A B with A = 2 ALG + Q, B = 2 OPT + Q, which for S ≥ S'' (A ≥ B) are S/S'' ≤ (1 + √2)² = 3 + 2√2
    (A/B ≤ 3 + 2√2), exactly the inequality 2 ALG + Q ≤ (3 + 2√2)(2 OPT + Q) of the manuscript''s proof;
    an integer form 2 ALG ≤ 12 OPT + 5 Q is added.

    - The guarantees are proved for every run of each algorithm with any tie-breaking (GreedyRun, RoundingRun),
    and against every assignment qs, OPT being the special case of an optimal qs; the canonical runs greedy
    and conditionalRounding break ties by position.

    - The fractional solution has a common denominator D with natural-number numerators; the relaxation
    objective is scaled by 2 D² (an integer), and optimality is quantified over all fractional solutions
    of the same option lists with any denominator, compared after clearing denominators. Theorem 17''s
    expectation is the finite sum over the product distribution of the independent choices, scaled by
    D^t.

    - Algorithm 2''s p_{C,e} is optionLoad, D times the sum of x*_{C,P} over the options P containing
    e (P.count e is 0 or 1 for a path of a simple cycle), as the manuscript describes it.

    - This package takes the enumerated cycles and an optimal fractional solution as given. cpap-runtimes
    proves Lemma 15''s executed greedy program and Lemma 16''s exact polynomial-time relaxation solver,
    and generalCycleEnumerationRam supplies a uniform fixed-length cycle enumerator. The manuscript''s
    cited algorithms remain cited. The paper gives Algorithm 2''s correctness and cost guarantee without
    a separate running-time theorem.'
alignment:
  namespace: STACS2027
  statements:
  - source: Algorithm 1 (greedy cycle-path assignment)
    lean: STACS2027.greedy_is_assignment
    module: Solution
    status: proved
    note: greedy is a run; every run (any tie-breaking) is a cycle-path assignment.
  - source: 'Lemma 13: ∑_e l(e)² ≤ (3 + 2√2) ∑_e l*(e)²'
    lean: STACS2027.greedy_sq_load_bound
    module: Solution
    status: proved
    note: As (S − S')² ≤ 4 S S', against every assignment.
  - source: 'Theorem 14: ALG ≤ (3 + 2√2) OPT + (1 + √2)(k − 2) t'
    lean: STACS2027.greedy_cost_bound, STACS2027.greedy_cost_integer_bound
    module: Solution
    status: proved
    note: As (A − B)² ≤ 4 A B with A = 2 ALG + Q, B = 2 OPT + Q; and 2 ALG ≤ 12 OPT + 5 Q.
  - source: Algorithm 2 (deterministic rounding by conditional expectation)
    lean: STACS2027.rounding_is_assignment
    module: Solution
    status: proved
    note: conditionalRounding is a run; every run is a cycle-path assignment.
  - source: 'Theorem 17: E[c(τ)] ≤ OPT + (k − 2) t / k'
    lean: STACS2027.randomized_rounding_cost_bound
    module: Solution
    status: proved
    note: As k D^t E[c(τ)] ≤ D^t (k OPT + (k − 2) t), for an optimal fractional solution with denominator
      D.
  - source: 'Theorem 18: c(τ) ≤ OPT + (k − 2) t / k'
    lean: STACS2027.conditional_rounding_cost_bound
    module: Solution
    status: proved
    note: As k c(τ) ≤ k OPT + (k − 2) t, for every run of Algorithm 2.
  - source: 'Lemma 16: the relaxation is solvable in polynomial time for fixed k'
    lean: STACS2027.Runtimes.QPRam.relaxSolver_ram_optimal
    module: Runtimes
    status: proved
    note: Proved in cpap-runtimes by an exact rational solver; the ANONYMIZED, ANONYMIZED and ANONYMIZED
      algorithm remains cited. This package takes its optimal fractional output as given.
  - source: 'Lemma 15: Algorithm 1 runs in O(kt + Υ_k) time'
    lean: STACS2027.Runtimes.Greedy.greedy_ram
    module: Runtimes
    status: proved
    note: Formalized in cpap-runtimes on the supplied cycle list; general cycle enumeration retains the
      parameter Υ_k.
