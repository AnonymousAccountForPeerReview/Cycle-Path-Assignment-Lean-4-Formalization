fidelity:
  divergences: '- Machine model, P, NP, polynomial-time functions and formula codes are those of the NP-completeness
    foundation NPCompleteness-Lean4: deterministic single-tape Turing machines over {blank, 0, 1, separator},
    time = number of steps, polynomial bounds c * (n + 1)^k, NP by polynomial-time verifiers with certificates
    of length at most p(|x|), formulas with unary variable indices. P = NP (PEqNP) means that every NP
    language is decided by a polynomial-time machine. Invariance under other machine models is not proved.

    - PCP: a verifier is non-adaptive and given as a polynomial-time map from (input, random string) to
    a CNF formula over the proof bits; the proof is accepted when it satisfies the formula, and the query
    complexity is the number of distinct proof bits the formula mentions. Random strings are all words
    of length c * log2(|x| + 2); soundness is 1/2. This is the usual non-adaptive formulation of PCP(O(log
    n), O(1)) with perfect completeness.

    - Gap reductions map to nonempty 3-CNF formulas (at most three literals per clause); the gap is stated
    as den * sat + num * m <= den * m for every assignment of a non-member''s formula with m clauses.

    - Optimization problems are relations Sol x y v on binary words with a direction. Only instances that
    have an optimum are constrained by approximation algorithms, L-reductions and PTAS-reductions. Approximation
    ratios are rationals a/b, opt <= (a/b) v for maximization; precision 1 + 1/(k + 1) for schemes. maxSNPHard_no_ptas
    excludes even one algorithm per precision (non-uniform in k); HasPTAS is a uniform scheme whose running
    time is polynomial in the instance for every fixed k.

    - A MaxSNP0 problem is given by an input signature ga and a solution signature sa (lists of arities)
    and a quantifier-free formula phi in k variables over input relations, solution relations and equality
    that is well formed for them (every atom applies a relation of the signature to as many variables
    as its arity, all variable indices below k). Instances are structures of signature ga on a universe
    {0, ..., n - 1}, coded as n in unary followed by the lists of tuples; solutions are structures of
    signature sa on the same universe (one relation per arity, each a list of distinct tuples of that
    arity with entries below n); the value is the number of k-tuples of the universe satisfying phi. These
    problems are in NPO (npo_maxSNP0). MaxSNP consists of the NPO problems L-reducible to a MaxSNP0 problem
    (the class of ANONYMIZED and ANONYMIZED; ANONYMIZED et al. call it MaxSNP''s closure). L-reductions
    have constants alpha, beta and map every solution of the image back.

    - NPO requires solutions of polynomially bounded length and one polynomial-time function computing
    feasibility and value (in binary); recognition of instances is implicit in that function. APX consists
    of the NPO problems with a polynomial-time constant-ratio approximation. APX-hardness is with respect
    to PTAS-reductions (ANONYMIZED-ANONYMIZED), with precisions 1/(k+1) and a computable precision map
    c.

    - MAX-3-SAT instances are codes of 3-CNF formulas (at most three literals per clause; empty and repeated
    clauses allowed, empty clauses never satisfied); a solution is a word of length at most the instance
    length read as an assignment (variable i is bit i, false beyond the end); the value is the number
    of satisfied clauses, counted with multiplicity. 3-OCCURRENCE MAX-3-SAT adds that every variable occurs
    at most three times in the whole formula.'
alignment:
  namespace: Complexity
  statements:
  - source: 'ANONYMIZED-ANONYMIZED-ANONYMIZED-ANONYMIZED-ANONYMIZED (1998): gap form of the PCP theorem
      for 3-SAT'
    lean: Complexity.pcp_gap
    module: Solution
    status: proved
    note: Gap num/den with num = 1, den = 40960 * (walk length of the amplification), a fixed but astronomically
      large constant.
  - source: 'ANONYMIZED-ANONYMIZED (1998); ANONYMIZED-ANONYMIZED-ANONYMIZED-ANONYMIZED-ANONYMIZED (1998):
      NP = PCP(O(log n), O(1))'
    lean: Complexity.pcp_theorem
    module: Solution
    status: proved
    note: Both inclusions; the query bound is 6 * den, a constant.
  - source: 'ANONYMIZED-ANONYMIZED (1991): the problems of MaxSNP0 are NP optimization problems'
    lean: Complexity.npo_maxSNP0
    module: Solution
    status: proved
  - source: 'ANONYMIZED-ANONYMIZED-ANONYMIZED-ANONYMIZED-ANONYMIZED (1998): MaxSNP-hard problems have
      no PTAS unless P = NP'
    lean: Complexity.maxSNPHard_no_ptas, Complexity.maxSNPHard_not_hasPTAS
    module: Solution
    status: proved
  - source: 'ANONYMIZED-ANONYMIZED (1991): MAX-3-SAT is MaxSNP-complete'
    lean: Complexity.max3SAT_maxSNPComplete
    module: Solution
    status: proved
  - source: 'ANONYMIZED-ANONYMIZED (1991); ANONYMIZED (1994), Theorem 13.10: 3-OCCURRENCE MAX-3-SAT is
      MaxSNP-complete'
    lean: Complexity.max3SAT3_maxSNPComplete
    module: Solution
    status: proved
  - source: 'ANONYMIZED-ANONYMIZED-ANONYMIZED-ANONYMIZED (1998); ANONYMIZED-ANONYMIZED (2000): MAX-3-SAT
