sources:
- title: 'Probabilistic checking of proofs: a new characterization of NP'
  type: paper
  id: doi:10.1145/273865.273901
  location: Journal of the ACM 45(1) (1998), 70-122
  relationship: formalizes
  note: The PCP theorem in its verifier form, NP = PCP(O(log n), O(1)) (with the companion paper below).
    The statement is formalized (Complexity.pcp_theorem); the proof here is not the original algebraic
    one but ANONYMIZED's.
- title: Proof verification and the hardness of approximation problems
  type: paper
  id: doi:10.1145/278298.278306
  location: Journal of the ACM 45(3) (1998), 501-555
  relationship: formalizes
  note: The PCP theorem with constant query complexity, its gap form for 3-SAT, and the consequence that
    MaxSNP-hard problems have no polynomial-time approximation scheme unless P = NP. All three statements
    are formalized (pcp_theorem, pcp_gap, maxSNPHard_no_ptas and maxSNPHard_not_hasPTAS).
- title: The PCP theorem by gap amplification
  type: paper
  id: doi:10.1145/1236457.1236459
  location: Journal of the ACM 54(3) (2007), Article 12
  relationship: adapts
  note: The proof of the gap form follows OpenAI's gap amplification (preprocessing with expanders,
    powering, alphabet reduction by an assignment tester), as formalized in the ANONYMIZED repository
    listed under related_formalizations. The explicit decoder that makes the reduction witness-recovering
    is new to this development; it follows the soundness arguments of the rounds.
- title: Optimization, approximation, and complexity classes
  type: paper
  id: doi:10.1016/0022-0000(91)90023-X
  location: Journal of Computer and System Sciences 43(3) (1991), 425-440
  relationship: formalizes
  note: 'L-reductions, the classes MaxSNP0 and MaxSNP, the MaxSNP-completeness of MAX-3-SAT and of its
    bounded-occurrence version. Formalized: max3SAT_maxSNPComplete and max3SAT3_maxSNPComplete. The occurrence
    reduction uses copies of each variable linked by an expander and then a torus gadget, as in the paper
    and in ANONYMIZED''s book.'
- title: Computational Complexity
  type: book
  location: Addison-Wesley (1994), Chapter 13 (Approximability), Theorem 13.10 and Corollary
  relationship: formalizes
  note: Textbook statement that 3-OCCURRENCE MAX-3-SAT is MaxSNP-complete, and definitions of L-reductions
    and MaxSNP followed by the statement.
- title: On approximation scheme preserving reducibility and its applications
  type: paper
  id: doi:10.1007/s002249910001
  location: Theory of Computing Systems 33(1) (2000), 1-16; preliminary version FSTTCS 1994
  relationship: formalizes
  note: PTAS-reductions, the reducibility under which APX-hardness and APX-completeness are defined in
    the statement (PTASReducible, APXHard, APXComplete).
- title: On syntactic versus computational views of approximability
  type: paper
  id: https://eccc.weizmann.ac.il/report/1995/023
  location: SIAM Journal on Computing 28(1) (1998), 164-191; ECCC TR95-023
  relationship: adapts
  note: 'APX-completeness of MAX-3-SAT: every APX problem reduces to MAX-3-SAT using a witness-recovering
    PCP theorem and a threshold construction. The construction here is a variant (multiplicative thresholds,
    blocks of balanced size), proved for PTAS-reductions.'
- title: 'Complexity and Approximation: Combinatorial Optimization Problems and Their Approximability
    Properties'
  type: book
  location: Springer (1999), Chapters 3 and 8
  relationship: background
  note: Textbook definitions of NPO, approximation schemes, APX and PTAS-reductions, used to check the
    definitions of the statement.
- title: Entropy waves, the zig-zag graph product, and new constant-degree expanders
  type: paper
  id: doi:10.2307/3062153
  location: Annals of Mathematics 155(1) (2002), 157-187
  relationship: background
  note: The explicit expander family used in gap amplification and in the occurrence reduction is built
    by zig-zag products in the ANONYMIZED development.
related_formalizations:
- id: https://github.com/openai/math
  relationship: adapts
  note: 'OpenAI mathematics repository, commit adc7f1241b42e322a6451854ab7e4b4c146bf78a, Lean formalization
    of result 102 (the Unique Games theorem), Apache-2.0. Its 194 files under OAI/Computability/UniqueGames
    (about 75,000 lines) are included in this repository: the closure of its 3-CNF gap map (ANONYMIZED''s
    gap amplification, the explicit expander family and their multi-stack machines). Changes, recorded
    in the header of every file: conversion to the Lean module system, removal of private modifiers and
    of a duplicate lemma, small proof adjustments for the module system and for Lean v4.35.0-rc2, a count-form
    restatement of one clause-gap theorem, an opaque wrapper for one large constant so that the NanoDa
    checker does not unfold it, and a new statement file PCP/GapTheorem.lean extracted from TableGapReductionLemmas.lean.
    OAI/LICENSE holds its licence; docs/PROVENANCE.md maps every adapted file to its upstream file.'
- id: NPCompleteness-Lean4 (the NP-completeness foundation), commit 3e603e795b44fedcf7d6dd65b7d1e30547ead925
  relationship: builds-on
  note: 'NP-completeness of SAT and 3-SAT (the ANONYMIZED-ANONYMIZED theorem) in Lean 4, at commit 3e603e795b44fedcf7d6dd65b7d1e30547ead925.
    Its machine model and definitions of P, NP and formula codes are reused verbatim in the statement,
    and the part of its Complexity library needed for the ANONYMIZED-ANONYMIZED reduction is included:
    75 files, byte-identical to that commit (one instance declaration in an unused file had to be fixed
    and that file was then dropped). New modules are added under Complexity/Reg, Complexity/Witness, Complexity/PCP
    and Complexity/Approx. docs/PROVENANCE.md lists the origin of every Lean file.'
- id: https://github.com/ANONYMIZED/complexitylib
  relationship: independent
  note: Complexitylib, a Lean 4 library of computational complexity theory, proves the PCP theorem NP
    = PCP[O(log n), O(1)] (Complexity.PCP_theorem in Complexitylib/Classes/PCP.lean, by ANONYMIZED, added
    in commit a27b9885), also by OpenAI's gap amplification, for its own machine model and definitions.
    Nothing from it is used or included here. At commit 3f4b5fee it contains nothing on MaxSNP, APX or
    polynomial-time approximation schemes.
status:
  scope: 'Proved: the nine compared theorems for the definitions of Challenge.lean. On the way: a witness-recovering
    ANONYMIZED-ANONYMIZED reduction (InNP.threeSAT_witness_explicit); a simulation of Mathlib''s polynomial-time
    multi-stack machines by the single-tape model (Bridge.stack_of_tm2, Bridge.exists_polyTime_of_tm2);
    a register language with calls and a framework (PT) for proving polynomial time of functions on coded
    data; the deterministic gap decoder and its soundness (Decode.gapDecode_satisfies) and polynomial
    time (Complexity.witnessGap); MAX-3-SAT in MaxSNP and MaxSNP-hard; a polynomial-time parser and feasibility
    check for MaxSNP0 problems (Complexity.snpFeas); the expander and torus occurrence reductions; membership
    of both problems in APX. Not included: invariance under other machine models; PCP statements with
    other parameters (e.g. three queries, or near-optimal soundness); MaxSNP-completeness of other problems;
    adaptive verifiers.'
