name = "pcp"
version = "0.1.0"
defaultTargets = ["Solution"]

[leanOptions]
autoImplicit = false

[[require]]
name = "np-completeness"
git = "https://github.com/RBarish-UTokyo/NPCompleteness-Lean4"
rev = "3e603e795b44fedcf7d6dd65b7d1e30547ead925"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc2"

[[lean_lib]]
name = "ComplexityExt"
globs = ["ComplexityExt.+"]

[[lean_lib]]
name = "OAI"
globs = ["OAI.+"]

[[lean_lib]]
name = "Bridge"
globs = ["Bridge.+"]

[[lean_lib]]
name = "PT"
globs = ["PT.+"]

[[lean_lib]]
name = "Hardness"
globs = ["Hardness.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
