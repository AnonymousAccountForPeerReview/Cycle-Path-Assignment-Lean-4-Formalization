version: v0.4
project:
  name: Outerplanar structure and exact cycle-path assignment algorithms in Lean 4
  description: Formalization of Section 8 and Appendices E and F of the accompanying cycle-path assignment
    paper. Proves the drawing/minor and block characterization of Lemma 19, the common-neighbour bound
    of Lemma 24, global elimination orders and Lemma 25/Algorithm 4 for loop-free outerplanar graphs,
    Theorem 20 from K23MinorFree, and the executable exact algorithms of Theorem 21 and Lemma 35. Definition
    26 and Lemmas 27–34 are proved in the polygon/weak-dual representation, including full leaf-face deletion,
    parent/child criteria, the DP recurrence and optimum, and the supporting cycle-count bounds. The contextual
    planar-triangle Hall and zero-cost assignment claims are proved from PlanarGraph alone. For fixed
    k≥3, the RAM endpoints bound execution by C(m+1) steps and accessed addresses by C(L+m+1), where m
    counts input entries and L bounds labels. All delivered proofs use only propext, Classical.choice
    and Quot.sound.
  license: Apache-2.0
  authors:
  - ANONYMIZED
  responsible_maintainers:
  - ANONYMIZED
