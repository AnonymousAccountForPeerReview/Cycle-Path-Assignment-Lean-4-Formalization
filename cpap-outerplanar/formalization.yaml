  - 05C10
  - 05C38
  - 05C85
  - 68W40
  - 68Q10
sources:
- title: 'Cycle-Path Assignment for Local Differential Privacy: Complexity and Approximation'
  type: other
  location: Section 8 (Lemma 19, Theorems 20 and 21); Appendix E (Lemmas 24 and 25, Algorithm 4 and the
    proof of Theorem 20); Appendix F (Definition 26, Lemmas 27–35 and the proof of Theorem 21)
  relationship: formalizes
  note: The numbered paper results and supporting claims are mapped to Lean in README.md and docs/paper-map.md.
    Source identity and result labels are recorded in docs/manuscript-provenance.json.
- title: A characterization of K_{2,4}-minor-free graphs
  type: paper
  id: doi:10.1137/140986517
  location: SIAM Journal on Discrete Mathematics 30(2), 955-975, 2016
  relationship: background
  note: 'Lemma 19 as the manuscript cites it. Proved here (outerplanar_block_structure, compared), by
    arguments of its own: the third sentence in combinatorial form by a longest cycle (twoConnectedK23_structure),
    the equivalence of drawings with the excluded minors by an explicit construction, closure of drawings
    under minors and face counts with Euler''s formula for hypermaps.'
- title: Outerplanar graphs and weak duals
  type: paper
  location: Journal of the Indian Mathematical Society 38(1-4), 215-219, 1974
  relationship: background
  note: Cited by the manuscript for the weak dual of a 2-connected outerplanar graph being a tree. Proved
    here in the polygon model (IsPolygon.weakDual_tree), a library theorem.
- title: 'Algorithm 447: efficient algorithms for graph manipulation'
  type: paper
  id: doi:10.1145/362248.362272
  location: Communications of the ACM 16(6), 372-378, 1973
  relationship: background
  note: The block decomposition by depth-first search and low points, which the algorithm and the proof
    of Theorem 20 use (palm trees, heads); formalized here.
