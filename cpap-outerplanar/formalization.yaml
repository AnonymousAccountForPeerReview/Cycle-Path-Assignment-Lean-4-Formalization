fidelity:
  divergences: Outerplanarity is a planar rotation-system drawing; minors are branch sets on the canonical
    simple-edge interpretation. A two-connected outerplanar block is relabelled as a polygon with noncrossing
    chords. The weak-dual and DP claims are proved there and connected to general graphs through structural
    and relabelling proofs. Lemma 27's count uses r+n=m+1; Lemma 28 covers both root and nonroot leaves.
    Lemmas 32–33 are abstract tree-DP statements instantiated by the polygon problem. For fixed k, RAM
    time is C(m+1) in raw input-list size and accessed addresses are bounded by C(L+m+1); these give O(n)
    time on simple minor-free graphs and O(n) memory for labels bounded by O(n). The unit-cost RAM has
    unbounded natural registers and no multiplication instruction. The solver computes outer Hamiltonian
    orders by ear elimination, uses memoized region paths and fixed optimal K₄ outputs, and reconstructs
    optimal paths. The explicit k-dependent constants differ from the paper's bounds. Retained proposition-valued
    specifications have proved witnesses; they are not unproved assumptions.
alignment:
  namespace: STACS2027
  statements:
  - source: 'Lemma 25 and Algorithm 4: every loop-free outerplanar graph has a global elimination order
      whose assignment is valid and has zero cost'
    lean: STACS2027.outerplanar_algorithm_perfect
    module: Solution
    status: proved
    note: An elimination order is constructed for every loop-free OuterplanarDrawing, with ValidChoices
      and exact zero cost for the literal algorithm4 output.
  - source: 'Contextual triangle claim: every planar graph admits a perfect assignment for k = 3'
    lean: STACS2027.TriangleMatching.planar_triangle_perfect_assignment
    module: Solution
    status: proved
    note: Requires only the foundation's PlanarGraph predicate. Triangle-side Hall inequalities and the
      matching construction are proved.
  - source: 'Lemma 19: a graph is outerplanar if it has a planar drawing with every vertex on the outer
      face; equivalently, it contains neither K₄ nor K_{2,3} as a minor; every 2-connected K_{2,3}-minor-free
      graph is either outerplanar or isomorphic to K₄'
    lean: STACS2027.outerplanar_block_structure
    module: Solution
    status: proved
    note: Outerplanarity as OuterplanarDrawing (a planar rotation system, the foundation's hypermap planarity,
      with every vertex of a component on one face); outerplanarDrawing_iff_minorFree and twoConnected_outerplanar_or_k4;
      twoConnectedK23_structure (not compared) is the third sentence in combinatorial form.
  - source: 'Theorem 20: every K_{2,3}-minor-free graph admits a perfect cycle-path assignment for k =
      4'
    lean: STACS2027.k23_perfect
    module: Solution
    status: proved
    note: Requires K23MinorFree g. The intermediate TwoConnectedK23Structure parameter is discharged by
      twoConnectedK23_structure.
  - source: 'Theorem 21: for every fixed k ≥ 3, an optimal cycle-path assignment on a K_{2,3}-minor-free
      graph with n vertices can be computed in O(n) time'
    lean: STACS2027.k23_linear_ram
    module: Solution
    status: proved
    note: On the unit-cost RAM, within C (m + 1) steps for the number m of input entries (O(n) for simple
      graphs) and the memory addresses below C (L + m + 1); the program outputs exactly the algorithm's
      answer (k23_linear_ram_solve, RAM.Main.k23Prog_computes).
  - source: 'Lemma 35: for every fixed k ≥ 3, an optimal cycle-path assignment on an outerplanar graph
      with n vertices can be computed in O(n) time'
    lean: STACS2027.outerplanar_linear_ram
    module: Solution
    status: proved
    note: Outerplanar as OuterplanarDrawing (Lemma 19's definition); time and memory as for Theorem 21.
  - source: 'Lemma 24: in a K_{2,3}-minor-free graph, any two distinct vertices have at most two common
      neighbors'
    lean: STACS2027.common_neighbours_le_two
    module: Solution
    status: proved
    note: Minors by branch sets on the simple graph of an edge list.
  - source: 'Lemma 27 (1): r = m - n + 1'
    lean: STACS2027.IsPolygon.euler_face_count
    module: Solution
    status: proved
    note: As r + n = m + 1, in the polygon model; the chord–dual-edge bijection κ is IsPolygon.chord_dualEdge_bij
      (not compared).
  - source: The weak dual of a 2-connected outerplanar graph is a tree (ANONYMIZED, ANONYMIZED, ANONYMIZED;
      cited in Appendix F)
    lean: STACS2027.IsPolygon.weakDual_tree
    module: Solution
    status: proved
    note: 'In the polygon model: connected with r - 1 edges. A library theorem, not compared.'
  - source: 'Lemma 27 (2) and (3): ∂T ≠ ∅ for nonempty T; deg_{∂S}(v) ∈ {0, 2} for subtrees S'
    lean: STACS2027.IsPolygon.bdry_ne_empty
    module: Solution
    status: proved
    note: With IsPolygon.bdry_deg; not compared.
  - source: 'Lemma 28: a leaf face has one chord, the rest of its boundary is a path of degree-two vertices'
    lean: STACS2027.IsPolygon.leaf_face
    module: Solution
    status: proved
    note: With root_leaf_unique_chord, root_leaf_inner_degree and face_path_of_edge, covers both non-root
      leaves and the root leaf. Not compared.
  - source: 'Lemma 28 (3): deletion of the leaf''s internal vertices'
    lean: STACS2027.IsPolygon.leaf_face_deletion
    module: Solution
    status: proved
    note: Exact all-cases bundled witness, with r ≥ 2 and an actual weak-dual degree-one leaf. New bounded
      faces are proved equivalent to faces of the new positional embedding. Compared directly.
  - source: 'Lemma 29: the restriction of ∂ to 𝒮 is a bijection onto 𝒞, and |∂S| = ∑ d_f - 2(|S| - 1)'
    lean: STACS2027.IsPolygon.cycle_subtree_bij
    module: Solution
    status: proved
    note: For the convex cycles, with inverse encl; IsPolygon.cycle_subtree_bij_simpleCycles (also compared)
      for IsCycle.
  - source: 'Supporting cycle-count bounds: at most 4^k simple k-cycles enclose a face, at most 2 · 4^k
      contain an edge'
    lean: STACS2027.IsPolygon.face_cycle_bound
    module: Solution
    status: proved
    note: With IsPolygon.edge_cycle_bound (also compared); the simple k-cycles counted as the convex k-cycles.
  - source: 'Proof of Lemma 35: a k-cycle encloses at most k-2 faces, each of perimeter at most k'
    lean: STACS2027.IsPolygon.enclosed_faces_bound
    module: Solution
    status: proved
    note: The retained proposition constant EnclosedFacesBound is proved by enclosedFacesBound_proved.
      Compared directly.
  - source: 'Proof of Lemma 35: at most 2^{M_k} cycle subtrees contain any given face'
    lean: STACS2027.IsPolygon.enclosing_cycle_count_bound
    module: Solution
    status: proved
    note: The retained proposition constant EnclosingCycleCountBound is proved by enclosingCycleCountBound_proved.
      The counting proof uses the sharper generating-function bound, with separate triangle and quadrilateral
      cases. Compared directly.
  - source: 'Lemma 31: the selected-face dichotomy, top-face criterion, and parent-face boundary criterion'
    lean: STACS2027.IsPolygon.cycle_child_dichotomy
    module: Solution
    status: proved
    note: Part (1), compared. With top_face_iff_parent_not_enclosed and boundary_iff_parent_enclosed for
      parts (2) and (3), using interval containment and the proved DP boundary notion.
  - source: 'Lemma 30: the owned edge sets partition E'
    lean: STACS2027.IsPolygon.own_spec
    module: Solution
    status: proved
    note: Ownership as a function (IsPolygon.own), in the polygon model. Not compared.
  - source: 'Lemmas 32 and 33: the cycles affecting a face are its own or boundary cycles; boundary cycles
      of a child (via the separately proved criteria of Lemma 31)'
    lean: STACS2027.TreeDP.Problem.top_eq_or_mem_boundary
    module: Solution
    status: proved
    note: Abstract forms, with TreeDP.Problem.boundary_child. Not compared.
  - source: 'Lemma 34: DP[v_f, α] is the least cost of the edges of G_{v_f} over the configurations of
      Q_{v_f} extending α; DP[v_r, ∅] = OPT'
    lean: STACS2027.IsPolygon.dp_table_correct
    module: Solution
    status: proved
    note: In the polygon model; IsPolygon.dp_root_optimal for the root. A library theorem, not compared.
  - source: Correctness of the algorithm of Theorem 21
    lean: STACS2027.solve_optimal
    module: Solution
    status: proved
    note: Requires k≥3 and K23MinorFree g. The intermediate structure parameter of Algo.solve_optimal
      is discharged by twoConnectedK23_structure.
