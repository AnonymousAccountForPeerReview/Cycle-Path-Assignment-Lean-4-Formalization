fidelity:
  divergences: The shared CPAP model enumerates simple cycles once per edge set and defines the manuscript's
    load objective. EliminationOrder, CommonNeighbourBound, EdgeDisjoint, CyclesInBlocks and OuterplanarOrK4
    are explicit interfaces; their witnesses for the paper's graph classes are proved in cpap-outerplanar.
    Algorithm 4 is represented by its earliest-vertex assignment. K₄ uses vertex labels 0–3 and transports
    to injectively relabelled copies. Lemma 23 uses r = n−2 and exact bounds; its planarity is a genus-zero
    hypermap in the foundation's representation. This package also supplies the block/K₄ base cases for
    the exact algorithm of Appendix F.
alignment:
  namespace: STACS2027
  statements:
  - source: 'Lemma 25 and Algorithm 4: elimination-order assignment interface'
    lean: STACS2027.algorithm4_perfect
    module: Solution
    status: proved
    note: Requires EliminationOrder and CommonNeighbourBound. cpap-outerplanar proves these from OuterplanarDrawing
      and provides the full loop-free graph endpoint outerplanar_algorithm_perfect.
  - source: 'Theorem 20''s proof: the K₄ assignment; Theorem 21''s proof: K₄ has no k-cycle for k ≥ 5'
    lean: STACS2027.k4_cycle_assignments
    module: Solution
    status: proved
    note: Transported to copies of K₄ by IsK4.perfect and IsK4.perfect_large.
  - source: Every cycle lies in a unique block, and distinct blocks have disjoint edge sets, so assignments
      and costs can be optimized independently
    lean: STACS2027.hasAssignment_blocks
    module: Solution
    status: proved
    note: For any list of pairwise edge-disjoint blocks within which every k-cycle lies.
  - source: 'Theorem 20: zero-cost block-combination interface'
    lean: STACS2027.perfect_assignment_of_blocks
    module: Solution
    status: proved
    note: Requires EdgeDisjoint, CyclesInBlocks and OuterplanarOrK4 for each block. cpap-outerplanar proves
      the witnesses and the full endpoint k23_perfect from K23MinorFree.
  - source: Lemma 23, lower bound by Cauchy–Schwarz
    lean: STACS2027.cost_lower_bound
    module: Solution
    status: proved
    note: Q² ≤ m (2 c(τ)+Q), with Q=(k−2)t, on duplicate-free graph edge lists and valid assignments.
  - source: 'Lemma 23: there is a family of planar graphs on n vertices whose optimal four-cycle assignment
      cost is Θ(n³) (K_{2,n−2})'
    lean: STACS2027.biclique_planar_family
    module: Solution
    status: proved
    note: K_{2,r} is planar (Complexity.PlanarGraph, the NP-completeness foundation's definition), has
      2r edges and binom(r, 2) four-cycles, and every assignment has cost between r(r−1)(r−3)/4 and r(r−1)(r−2),
      with r = n − 2.
  - source: 'Theorem 21 and Appendix F: O(n)-time exact algorithm on K_{2,3}-minor-free graphs'
    lean: STACS2027.k23_linear_ram, STACS2027.outerplanar_linear_ram
    module: Outerplanar
    status: proved
    note: The full RAM endpoints are proved in cpap-outerplanar. This package supplies block composition
      and K₄ base cases used in their proof.
