status:
  scope: The four comparison endpoints and supporting reduction lemmas are proved. The four-cycle network
    has target value 2t, 10t arcs, and at most 6t + 2 nodes; the triangle network has target value t,
    7t arcs, and at most 4t + 2 nodes. Mathematical optimality transfer needs no flow-algorithm premise.
    cpap-runtimes supplies the executed programs and Corollary 3 pipeline with explicit flow hypotheses.
    The almost-linear minimum-cost-flow implementation and resource analysis are the sole excluded algorithmic
    contract. Flow.MinCostFlowSolver F T is an explicit correctness and resource premise; Flow.AlmostLinear
    T adds the almost-linear bound. These are theorem hypotheses, not additional Lean axioms.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
  main_results:
  - declaration: STACS2027.cpap4_iff_flow
    file: Tractability/FlowEquivalence.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    comparator_config: comparator.json
  - declaration: STACS2027.fourCycleNetwork_size
    file: Tractability/NetworkSize.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    comparator_config: comparator.json
  - declaration: STACS2027.cpap3_iff_flow
    file: Tractability/TriangleEquivalence.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    comparator_config: comparator.json
  - declaration: STACS2027.triangleNetwork_size
    file: Tractability/TriangleSize.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    comparator_config: comparator.json
fidelity:
  divergences: Cycles are identified by edge set through the shared CPAP definitions. Networks and integral
    unit-capacity flows are lists of arc occurrences; parallel sink arcs are distinguished by cost. Cost
    is preserved in the forward direction and bounded from above by the flow cost in the reverse direction.
    The package proves the mathematical reductions; executed runtime claims belong to cpap-runtimes and
    retain their flow premises.
alignment:
  namespace: STACS2027
  statements:
  - source: 'Theorem 2 and Appendix A: the min-cost flow reduction for CPAP(G, 4)'
    lean: 'STACS2027.cpap4_iff_flow : HasAssignment g 4 budget ↔ ∃ flow, IsFlow (fourCycleNetwork g) flow
      ∧ flowValue flow = 2 * t ∧ flowCost flow ≤ budget'
    module: Solution
    status: proved
    note: Both directions of the correspondence between assignments and integral flows of value 2t, with
      equal cost from assignments to flows and no greater cost back; hence the optimum of CPAP(G, 4) is
      the minimum cost of such a flow.
  - source: 'Appendix A: |X| = 2t, |Y| ≤ 4t, |E_𝓕| = O(t), U = 1, Q ≤ t - 1'
    lean: STACS2027.fourCycleNetwork_size
    module: Solution
    status: proved
    note: Exactly 10t arcs; at most 6t + 2 nodes; every arc between two nodes with cost below t.
  - source: 'Section 3 triangle reduction: the modified network and its correctness'
    lean: 'STACS2027.cpap3_iff_flow : HasAssignment g 3 budget ↔ ∃ flow, IsFlow (triangleNetwork g) flow
      ∧ flowValue flow = t ∧ flowCost flow ≤ budget'
    module: Solution
    status: proved
    note: '"An integral flow of value t selects one edge per triangle and has minimum cost exactly when
      the corresponding assignment is optimal": both directions, with equal cost from assignments to flows
      and no greater cost back.'
  - source: 'Section 3 triangle reduction: the network has O(t) vertices and arcs'
    lean: STACS2027.triangleNetwork_size
    module: Solution
    status: proved
    note: Exactly 7t arcs; at most 4t + 2 nodes; every arc between two nodes with cost below t.
  - source: Theorem 2 and Section 3 triangle reduction (running times), Corollary 3
    lean: STACS2027.Runtimes.Flow.cpap4_flow_ram_semantic, STACS2027.Runtimes.cpap4_enum_ram_semantic,
      STACS2027.Runtimes.fourCycleAssignment_single
    module: Runtimes.CpapSingle.Complete
    status: proved
    note: 'Companion cpap-runtimes proofs supply construction, extraction and Corollary 3 composition
      conditionally on the explicit flow contract: F for a supplied resource bound and F+ for its almost-linear
      variants.'
