version: v0.4
project:
  name: Four-cycle and triangle flow reductions in Lean 4
  description: 'Mathematical flow reductions in Section 3 and Appendix A: Theorem 2''s four-cycle assignment/flow
    equivalence and exact network sizes, and the triangle extension. The assignment-to-flow direction
    preserves cost; the flow-to-assignment direction does not increase it. These proofs use only propext,
    Classical.choice, and Quot.sound. Executed construction, extraction, enumeration, and the conditional
    runtime claims are supplied by cpap-runtimes. The almost-linear minimum-cost-flow implementation and
    resource analysis are the sole excluded algorithmic contract. Flow.MinCostFlowSolver F T is an explicit
    correctness and resource premise; Flow.AlmostLinear T adds the almost-linear bound. These are theorem
    hypotheses, not additional Lean axioms.'
  license: Apache-2.0
  authors:
  - ANONYMIZED
  responsible_maintainers:
  - ANONYMIZED
classification:
  arxiv:
  - cs.DS
  - cs.CC
  msc2020:
  - 68Q25
  - 05C38
  - 90C27
  - 68V20
sources:
- title: 'Cycle-Path Assignment for Local Differential Privacy: Complexity and Approximation'
  type: other
  location: Section 3 (Theorem 2 and the triangle reduction), Appendix A
  relationship: formalizes
  note: The numbered paper results and supporting claims are mapped to Lean in README.md and docs/paper-map.md.
    Source identity and result labels are recorded in docs/manuscript-provenance.json.
- title: A Deterministic Almost-Linear Time Algorithm for Minimum-Cost Flow
