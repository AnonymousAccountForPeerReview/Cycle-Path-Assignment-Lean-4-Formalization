  location: FOCS 2023, 503-514
  relationship: background
  note: The almost-linear minimum-cost-flow implementation and resource analysis are the sole excluded
    algorithmic contract. Flow.MinCostFlowSolver F T is an explicit correctness and resource premise;
    Flow.AlmostLinear T adds the almost-linear bound. These are theorem hypotheses, not additional Lean
